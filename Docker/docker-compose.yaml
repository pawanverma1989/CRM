services:

  # ── Identity DB ────────────────────────────────────────────────────────────
  identity-db:
    image: postgres:14-alpine
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_svc
      POSTGRES_PASSWORD: "${IDENTITY_DB_PASSWORD:-change_me}"
    volumes:
      - ../services/identity/db/data:/var/lib/postgresql/data
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_svc -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Identity DB Migrations (Flyway) ────────────────────────────────────────
  identity-migrate:
    image: flyway/flyway:10-alpine
    container_name: identity-migrate
    command: >
      -url=jdbc:postgresql://identity-db:5432/identity_db
      -user=identity_svc
      -password=${IDENTITY_DB_PASSWORD:-change_me}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ../services/identity/db/migrations:/flyway/sql:ro
    networks:
      - identity-network
    depends_on:
      identity-db:
        condition: service_healthy

  # ── Identity API ───────────────────────────────────────────────────────────
  identity-api:
    build:
      context: ../services/identity/identity-api
      dockerfile: Dockerfile
    container_name: identity-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__IdentityDb: "Host=identity-db;Port=5432;Database=identity_db;Username=identity_svc;Password=${IDENTITY_DB_PASSWORD:-change_me};Pooling=true"
      Jwt__Issuer: "crm-identity"
      Jwt__Audience: "crm-services"
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
      Jwt__KeyId: "crm-identity-key-v1"
      Jwt__PrivateKeyPem: "${JWT_PRIVATE_KEY_PEM:-}"
      Auth__MaxFailedLoginAttempts: "${AUTH_MAX_FAILED_ATTEMPTS:-5}"
      Auth__LockoutDurationMinutes: "${AUTH_LOCKOUT_DURATION_MINUTES:-15}"
      Auth__PasswordResetRateLimitPerHour: "${AUTH_PWD_RESET_RATE_LIMIT:-3}"
      AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost}"
    networks:
      - identity-network
      - commonservice-network
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Identity Frontend ──────────────────────────────────────────────────────
  identity-frontend:
    build:
      context: ../services/identity/frontend
      dockerfile: Dockerfile
    container_name: identity-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "${VITE_API_URL:-/api/identity/v1}"
    ports:
      - "3000:80"
    networks:
      - commonservice-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Customer DB ────────────────────────────────────────────────────────────
  customer-db:
    image: postgres:14-alpine
    container_name: customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_svc
      POSTGRES_PASSWORD: "${CUSTOMER_DB_PASSWORD:-change_me}"
    volumes:
      - ../services/customer/db/data:/var/lib/postgresql/data
    networks:
      - customer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_svc -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Customer DB Migrations (Flyway) ────────────────────────────────────────
  customer-migrate:
    image: flyway/flyway:10-alpine
    container_name: customer-migrate
    command: >
      -url=jdbc:postgresql://customer-db:5432/customer_db
      -user=customer_svc
      -password=${CUSTOMER_DB_PASSWORD:-change_me}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ../services/customer/db/migrations:/flyway/sql:ro
    networks:
      - customer-network
    depends_on:
      customer-db:
        condition: service_healthy

  # ── Customer API ───────────────────────────────────────────────────────────
  customer-api:
    build:
      context: ../services/customer/customer-api
      dockerfile: Dockerfile
    container_name: customer-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__CustomerDb: "Host=customer-db;Port=5432;Database=customer_db;Username=customer_svc;Password=${CUSTOMER_DB_PASSWORD:-change_me};Pooling=true"
      # This service only validates tokens — it never holds a private signing key.
      Jwt__Issuer: "crm-identity"
      Jwt__Audience: "crm-services"
      Identity__JwksUrl: "http://identity-api:8080/.well-known/jwks.json"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${RABBITMQ_USER:-crm_user}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-change_me}"
      RabbitMq__Exchange: "crm.customer.events"
      AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost}"
      Customer__RecycleBinRetentionDays: "${CUSTOMER_RECYCLE_BIN_DAYS:-30}"
      Customer__MaxBulkRecords: "${CUSTOMER_MAX_BULK_RECORDS:-500}"
      Customer__MaxImportRowsPerCall: "${CUSTOMER_MAX_IMPORT_ROWS:-1000}"
      Customer__MaxActiveCustomFields: "${CUSTOMER_MAX_CUSTOM_FIELDS:-50}"
      Customer__DsrExportPath: "/var/crm/dsr-exports"
    volumes:
      - customer-dsr-exports:/var/crm/dsr-exports
    networks:
      - customer-network
      - commonservice-network
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
      # service_started, not service_healthy: NFR-9 requires saves to succeed
      # with the broker down (events then wait in outbox_events), so a RabbitMQ
      # outage must never stop this API from starting.
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Customer Frontend ──────────────────────────────────────────────────────
  customer-frontend:
    build:
      context: ../services/customer/frontend
      dockerfile: Dockerfile
    container_name: customer-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "${CUSTOMER_VITE_API_URL:-/api/customer/v1}"
      VITE_IDENTITY_API_URL: "${VITE_IDENTITY_API_URL:-/api/identity/v1}"
    ports:
      - "3001:80"
    networks:
      - commonservice-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Lead DB ────────────────────────────────────────────────────────────────
  lead-db:
    image: postgres:14-alpine
    container_name: lead-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lead_db
      POSTGRES_USER: lead_svc
      POSTGRES_PASSWORD: "${LEAD_DB_PASSWORD:-change_me}"
    volumes:
      - ../services/lead/db/data:/var/lib/postgresql/data
    networks:
      - lead-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_svc -d lead_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Lead DB Migrations (Flyway) ────────────────────────────────────────────
  lead-migrate:
    image: flyway/flyway:10-alpine
    container_name: lead-migrate
    command: >
      -url=jdbc:postgresql://lead-db:5432/lead_db
      -user=lead_svc
      -password=${LEAD_DB_PASSWORD:-change_me}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ../services/lead/db/migrations:/flyway/sql:ro
    networks:
      - lead-network
    depends_on:
      lead-db:
        condition: service_healthy

  # ── Lead API ───────────────────────────────────────────────────────────────
  lead-api:
    build:
      context: ../services/lead/lead-api
      dockerfile: Dockerfile
    container_name: lead-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__LeadDb: "Host=lead-db;Port=5432;Database=lead_db;Username=lead_svc;Password=${LEAD_DB_PASSWORD:-change_me};Pooling=true"
      Jwt__Issuer: "crm-identity"
      Jwt__Audience: "crm-services"
      Identity__JwksUrl: "http://identity-api:8080/.well-known/jwks.json"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${RABBITMQ_USER:-crm_user}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-change_me}"
      RabbitMq__Exchange: "crm.lead.events"
      RabbitMq__Queue: "lead.consumer"
      RabbitMq__DeadLetterExchange: "crm.lead.events.dead"
      RabbitMq__ConsumeExchanges__0: "crm.activity.events"
      RabbitMq__ConsumeExchanges__1: "crm.customer.events"
      RabbitMq__ConsumeExchanges__2: "crm.sales.events"
      RabbitMq__ConsumeExchanges__3: "crm.identity.events"
      RabbitMq__ConsumeExchanges__4: "crm.compliance.events"
      AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost}"
      Lead__RecycleBinRetentionDays: "${LEAD_RECYCLE_BIN_DAYS:-30}"
      Lead__MaxBulkRecords: "${LEAD_MAX_BULK_RECORDS:-500}"
      Lead__MaxImportRowsPerCall: "${LEAD_MAX_IMPORT_ROWS:-1000}"
      Lead__MaxActiveCustomFields: "${LEAD_MAX_CUSTOM_FIELDS:-50}"
      Lead__MaxConversionRetries: "${LEAD_MAX_CONVERSION_RETRIES:-5}"
      Lead__WebFormSubmissionsPerIpPerHour: "${LEAD_WEB_FORM_RATE_LIMIT:-10}"
      ServiceClients__CustomerApiBaseUrl: "http://customer-api:8080"
      ServiceClients__SalesApiBaseUrl: "http://sales-api:8080"
      ServiceClients__ServiceToken: "${LEAD_SERVICE_TOKEN:-change_me}"
    volumes:
      - lead-dsr-exports:/var/crm/dsr-exports
    networks:
      - lead-network
      - commonservice-network
    depends_on:
      lead-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Lead Frontend ──────────────────────────────────────────────────────────
  lead-frontend:
    build:
      context: ../services/lead/frontend
      dockerfile: Dockerfile
    container_name: lead-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "${LEAD_VITE_API_URL:-/api/lead/v1}"
      VITE_IDENTITY_API_URL: "${VITE_IDENTITY_API_URL:-/api/identity/v1}"
    ports:
      - "3002:80"
    networks:
      - commonservice-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Message Broker ─────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-crm_user}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-change_me}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - commonservice-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../NGINX/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - commonservice-network
    depends_on:
      identity-api:
        condition: service_healthy
      identity-frontend:
        condition: service_healthy
      # service_started is enough: nginx only needs these names to resolve so
      # its upstream blocks load. Gating on health would mean one sick service
      # keeps the reverse proxy — and therefore every other service — down.
      customer-api:
        condition: service_started
      customer-frontend:
        condition: service_started
      lead-api:
        condition: service_started
      lead-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── DB Admin (dev only) ────────────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: crm-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - identity-network
      - customer-network
      - lead-network

networks:
  identity-network:
    name: identity-network
    driver: bridge
  customer-network:
    name: customer-network
    driver: bridge
  lead-network:
    name: lead-network
    driver: bridge
  commonservice-network:
    name: commonservice-network
    driver: bridge

volumes:
  rabbitmq-data:
    name: crm-rabbitmq-data
    driver: local
  # DSR (access-request) export files written by the Customer API. Not service
  # database data, so a named volume is fine here — the agent rule requiring a
  # bind mount applies to each service's PostgreSQL data directory only.
  customer-dsr-exports:
    name: crm-customer-dsr-exports
    driver: local
  lead-dsr-exports:
    name: crm-lead-dsr-exports
    driver: local
