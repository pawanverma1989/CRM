services:

  identity-api:
    build:
      context: ../services/identity/identity-api
      dockerfile: Dockerfile
    container_name: identity-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityDb: "Host=identity-db;Port=5432;Database=identity_db;Username=identity_svc;Password=${IDENTITY_DB_PASSWORD:-change_me};Pooling=true"
      Jwt__Issuer: "crm-identity"
      Jwt__Audience: "crm-services"
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"
      Jwt__KeyId: "crm-identity-key-v1"
      Jwt__PrivateKeyPem: "${JWT_PRIVATE_KEY_PEM:-}"
    networks:
      - identity-network
      - commonservice-network
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  identity-db:
    image: postgres:14-alpine
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_svc
      POSTGRES_PASSWORD: "${IDENTITY_DB_PASSWORD:-change_me}"
    volumes:
      - ../services/identity/db/data:/var/lib/postgresql/data
      - ../db/01_identity_db.sql:/docker-entrypoint-initdb.d/01_identity_db.sql:ro
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_svc -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-crm_user}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-change_me}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - commonservice-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../NGINX/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - commonservice-network
    depends_on:
      - identity-api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:4
    container_name: crm-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - identity-network

networks:
  identity-network:
    name: identity-network
    driver: bridge
  commonservice-network:
    name: commonservice-network
    driver: bridge

volumes:
  rabbitmq-data:
    name: crm-rabbitmq-data
    driver: local
