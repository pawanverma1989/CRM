events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers applied globally
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         DENY always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Rate-limit zones
    limit_req_zone $binary_remote_addr zone=login:10m    rate=5r/m;   # auth endpoints
    limit_req_zone $binary_remote_addr zone=pwdreset:10m rate=3r/m;   # password forgot
    limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;  # general API

    # Upstreams
    upstream identity_api {
        server identity-api:8080;
        keepalive 32;
    }

    upstream identity_frontend {
        server identity-frontend:80;
        keepalive 16;
    }

    upstream customer_api {
        server customer-api:8080;
        keepalive 32;
    }

    upstream customer_frontend {
        server customer-frontend:80;
        keepalive 16;
    }

    upstream lead_api {
        server lead-api:8080;
        keepalive 32;
    }

    upstream lead_frontend {
        server lead-frontend:80;
        keepalive 16;
    }

    upstream sales_api {
        server sales-api:8080;
        keepalive 32;
    }

    upstream sales_frontend {
        server sales-frontend:80;
        keepalive 16;
    }

    # Rate-limit zone for public web form submissions (WEB-4: max 10/IP/hour).
    # nginx only supports r/s and r/m, so 1r/m is used as a burst guard here;
    # the actual 10/IP/hour cap is enforced by the lead-api backend.
    limit_req_zone $binary_remote_addr zone=webform:10m rate=1r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ── Auth endpoints (login / refresh / logout) — rate-limited ────────
        location /api/identity/v1/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Forgot-password endpoint — strict rate-limit per IP ──────────────
        location = /api/identity/v1/password/forgot {
            limit_req zone=pwdreset burst=3 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── All other Identity API endpoints ─────────────────────────────────
        location /api/identity/ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Lead public form endpoint — no JWT, strict rate-limit, 20 KB body ─
        # NFR-3: must keep working when other services are down.
        # NFR-4: body size capped at 20 KB; rate-limited per IP (WEB-4).
        location ~ ^/api/lead/v1/public/forms/[^/]+/submit$ {
            limit_req zone=webform burst=3 nodelay;
            client_max_body_size 20k;
            proxy_pass         http://lead_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── Lead bulk endpoints — large bodies, long timeout ─────────────────
        location = /api/lead/v1/bulk-upsert {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://lead_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/lead/v1/export {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://lead_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── All other Lead API endpoints ──────────────────────────────────────
        location /api/lead/ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://lead_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Sales bulk endpoints — large bodies, long timeout ───────────────
        location = /api/sales/v1/bulk-upsert {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://sales_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/sales/v1/export {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://sales_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── All other Sales API endpoints ─────────────────────────────────────
        location /api/sales/ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://sales_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Customer bulk endpoints — large bodies, long timeout ─────────────
        # /bulk-upsert takes up to 1,000 rows per call and must finish inside
        # 10 s (NFR-3); /export streams paged records for CSV export. Exact
        # (`=`) matches, so they are chosen before any prefix or regex block;
        # query strings are not part of location matching.
        location = /api/customer/v1/bulk-upsert {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://customer_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/customer/v1/export {
            limit_req zone=general burst=50 nodelay;
            client_max_body_size 25m;
            proxy_pass         http://customer_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── All other Customer API endpoints ─────────────────────────────────
        location /api/customer/ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://customer_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── JWKS — public key endpoint, aggressively cached ──────────────────
        location = /.well-known/jwks.json {
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_cache_valid  200 1h;
            add_header         Cache-Control "public, max-age=3600" always;
        }

        # ── Health probes (internal, no access log) ──────────────────────────
        location = /health {
            proxy_pass http://identity_api;
            access_log off;
        }

        # ── Static assets, scoped per frontend ────────────────────────────────
        # nginx evaluates regex locations in file order and before any prefix
        # location, so scoped asset blocks MUST stay above the generic one
        # below — otherwise hashed assets built with a sub-path base would
        # be served from the wrong frontend container.
        location ~* ^/sales/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://sales_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires 1y;
            add_header         Cache-Control "public, immutable" always;
        }

        location ~* ^/leads/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://lead_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires 1y;
            add_header         Cache-Control "public, immutable" always;
        }

        location ~* ^/customer/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://customer_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires 1y;
            add_header         Cache-Control "public, immutable" always;
        }

        # Identity frontend assets (served from the root path prefix).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://identity_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires 1y;
            add_header         Cache-Control "public, immutable" always;
        }

        # ── Customer frontend SPA — served under the /customer/ prefix ────────
        # The URI is passed through unchanged (no trailing slash on proxy_pass),
        # so the container sees /customer/... and its own nginx serves
        # index.html for any unmatched route (React Router basename="/customer").
        location /customer/ {
            proxy_pass         http://customer_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Bare /customer → /customer/ so relative asset paths resolve correctly.
        location = /customer {
            return 301 /customer/;
        }

        # ── Lead frontend SPA — served under the /leads/ prefix ──────────────
        location /leads/ {
            proxy_pass         http://lead_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Bare /leads → /leads/ so relative asset paths resolve correctly.
        location = /leads {
            return 301 /leads/;
        }

        # ── Sales frontend SPA — served under the /sales/ prefix ────────────
        location /sales/ {
            proxy_pass         http://sales_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Bare /sales → /sales/ so relative asset paths resolve correctly.
        location = /sales {
            return 301 /sales/;
        }

        # ── Identity frontend SPA — all remaining paths ───────────────────────
        # index.html served for all routes so React Router handles client-side
        # navigation.
        location / {
            proxy_pass         http://identity_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
