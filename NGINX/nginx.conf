events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers applied globally
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         DENY always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Rate-limit zones
    limit_req_zone $binary_remote_addr zone=login:10m    rate=5r/m;   # auth endpoints
    limit_req_zone $binary_remote_addr zone=pwdreset:10m rate=3r/m;   # password forgot
    limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;  # general API

    # Upstreams
    upstream identity_api {
        server identity-api:8080;
        keepalive 32;
    }

    upstream identity_frontend {
        server identity-frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ── Auth endpoints (login / refresh / logout) — rate-limited ────────
        location /api/identity/v1/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Forgot-password endpoint — strict rate-limit per IP ──────────────
        location = /api/identity/v1/password/forgot {
            limit_req zone=pwdreset burst=3 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── All other Identity API endpoints ─────────────────────────────────
        location /api/identity/ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── JWKS — public key endpoint, aggressively cached ──────────────────
        location = /.well-known/jwks.json {
            proxy_pass         http://identity_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_cache_valid  200 1h;
            add_header         Cache-Control "public, max-age=3600" always;
        }

        # ── Health probes (internal, no access log) ──────────────────────────
        location = /health {
            proxy_pass http://identity_api;
            access_log off;
        }

        # ── Identity frontend SPA — all remaining paths ───────────────────────
        # Long-cache for hashed static assets; index.html served for all routes
        # so React Router handles client-side navigation.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://identity_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires 1y;
            add_header         Cache-Control "public, immutable" always;
        }

        location / {
            proxy_pass         http://identity_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
