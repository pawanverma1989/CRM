server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Runtime config must never be cached — it is rewritten on every container start.
    location = /customer/env-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed assets built by Vite under base=/customer/
    location ~* ^/customer/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unmatched /customer/* route serves this app's index.html
    location /customer/ {
        try_files $uri $uri/ /customer/index.html;
    }

    # Container health probe. The compose healthcheck runs
    # `curl -f http://localhost:80/` inside the container, so `/` must answer
    # 2xx; the app itself is only ever reached through /customer/.
    location = / {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
